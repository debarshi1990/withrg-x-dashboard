<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="WithRG X Dashboard - Professional Twitter management platform for political volunteer networks" />
    <meta name="keywords" content="twitter, social media, political, campaign, management, dashboard, withRG" />
    <meta name="author" content="WithRG Team" />
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WithRG X Dashboard" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
    
    <!-- Microsoft PWA Meta Tags -->
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/icon-144x144.png" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-navbutton-color" content="#3b82f6" />
    <meta name="msapplication-starturl" content="/" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="WithRG X Dashboard" />
    <meta property="og:description" content="Professional Twitter management platform for political volunteer networks" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512x512.png" />
    <meta property="og:url" content="https://withrg-x-dashboard.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WithRG X Dashboard" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WithRG X Dashboard" />
    <meta name="twitter:description" content="Professional Twitter management platform for political volunteer networks" />
    <meta name="twitter:image" content="%PUBLIC_URL%/icons/icon-512x512.png" />
    
    <title>WithRG X Dashboard - Political Twitter Management</title>
    
    <!-- Splash Screen Styles -->
    <style>
      /* App Loading Styles */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        background: #3b82f6;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      .loading-text {
        color: #ffffff;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .loading-subtitle {
        color: #94a3b8;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #374151;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 20px;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading when app is ready */
      .app-ready #app-loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- App Loading Screen -->
    <div id="app-loading">
      <div class="loading-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
          <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
        </svg>
      </div>
      <div class="loading-text">WithRG X Dashboard</div>
      <div class="loading-subtitle">Loading your political Twitter command center...</div>
      <div class="loading-spinner"></div>
    </div>
    
    <!-- Main App Root -->
    <div id="root"></div>
    
    <!-- PWA Installation Script -->
    <script>
      // PWA Installation Logic
      let deferredPrompt;
      let installButton;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('PWA install prompt ready');
        e.preventDefault();
        deferredPrompt = e;
        
        // Show custom install button or banner
        showInstallPromotion();
      });
      
      function showInstallPromotion() {
        // Create install banner if not exists
        if (!document.getElementById('install-banner')) {
          const banner = document.createElement('div');
          banner.id = 'install-banner';
          banner.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #3b82f6;
            color: white;
            padding: 12px 16px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
          `;
          
          banner.innerHTML = `
            <span>📱 Install WithRG X Dashboard for easy access</span>
            <button id="install-btn" style="
              background: white;
              color: #3b82f6;
              border: none;
              padding: 6px 12px;
              border-radius: 4px;
              cursor: pointer;
              font-weight: bold;
            ">Install</button>
            <button id="dismiss-btn" style="
              background: transparent;
              color: white;
              border: none;
              padding: 6px;
              cursor: pointer;
              margin-left: 8px;
            ">✕</button>
          `;
          
          document.body.appendChild(banner);
          
          // Install button click
          document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              console.log(`PWA install outcome: ${outcome}`);
              deferredPrompt = null;
              banner.remove();
            }
          });
          
          // Dismiss button click
          document.getElementById('dismiss-btn').addEventListener('click', () => {
            banner.remove();
          });
        }
      }
      
      // Handle successful install
      window.addEventListener('appinstalled', (evt) => {
        console.log('PWA was installed successfully');
        const banner = document.getElementById('install-banner');
        if (banner) banner.remove();
      });
      
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered successfully:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New version available
                    showUpdateAvailable();
                  }
                });
              });
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
      
      function showUpdateAvailable() {
        const updateBanner = document.createElement('div');
        updateBanner.style.cssText = `
          position: fixed;
          bottom: 20px;
          left: 20px;
          right: 20px;
          background: #059669;
          color: white;
          padding: 16px;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          z-index: 1000;
          display: flex;
          justify-content: space-between;
          align-items: center;
        `;
        
        updateBanner.innerHTML = `
          <span>🚀 New version available! Refresh to update.</span>
          <button onclick="window.location.reload()" style="
            background: white;
            color: #059669;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
          ">Update</button>
        `;
        
        document.body.appendChild(updateBanner);
        
        setTimeout(() => {
          if (updateBanner.parentNode) {
            updateBanner.remove();
          }
        }, 10000);
      }
      
      // Hide loading screen when React app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('app-ready');
        }, 1000);
      });
      
      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', () => {
          setTimeout(() => {
            const perfData = performance.getEntriesByType('navigation')[0];
            console.log('App load time:', perfData.loadEventEnd - perfData.fetchStart, 'ms');
          }, 0);
        });
      }
    </script>
  </body>
</html>
